[project]
name = "binance-auto"
version = "0.1.0"
description = "Backtesting and risk-controlled Binance Spot automation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "typer>=0.16,<1",
]

[project.scripts]
binance-auto = "binance_auto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binance_auto"]
